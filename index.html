
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Loading Screen</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#screen {
    position: absolute;
    width: 1920px;
    height: 1080px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--screen-scale, 1));
    transform-origin: center;
    overflow: hidden;
    background: #000;
}

.background {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    opacity: 0;
    z-index: 0;
    transition: opacity 2s ease-in-out;
}

.background.active {
    opacity: 1;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
    pointer-events: none;
}

.logo-container {
    position: absolute;
    left: 90px;
    bottom: 70px;
    z-index: 2;
}

.logo {
    display: block;
    width: 160px;
    height: auto;
}
</style>
</head>

<body>

<div id="screen">

    <img id="background1" class="background active">
    <img id="background2" class="background">

    <div class="overlay"></div>

    <div class="logo-container">
        <img class="logo" src="assets/logo.gif" alt="Server Logo">
    </div>

</div>

<audio id="music" autoplay loop preload="auto" src="assets/music.mp3"></audio>

<script>
const screen = document.getElementById("screen");

function resizeScreen() {
    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    screen.style.setProperty("--screen-scale", scale);
}

window.addEventListener("resize", resizeScreen);
resizeScreen();

// Background slideshow

const images = [
    "assets/ld1.png",
    "assets/ld2.png",
    "assets/ld3.png"
];

const background1 = document.getElementById("background1");
const background2 = document.getElementById("background2");

let currentImage = 0;
let showingFirst = true;

background1.src = images[0];

if (images.length > 1) {
    background2.src = images[1];
}

function changeBackground() {
    if (images.length < 2) return;

    currentImage = (currentImage + 1) % images.length;

    const next = showingFirst ? background2 : background1;
    const previous = showingFirst ? background1 : background2;

    next.src = images[currentImage];

    next.classList.add("active");
    previous.classList.remove("active");

    showingFirst = !showingFirst;
}

setInterval(changeBackground, 20000);

// Music

const music = document.getElementById("music");

music.volume = 0.35;

function startMusic() {
    music.play().catch(error => {
        console.log("Music playback failed:", error);
    });
}

window.addEventListener("load", startMusic);
</script>

</body>
</html>
