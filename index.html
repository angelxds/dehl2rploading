<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Loading Screen</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    position: relative;
}

/* Screen scaling */

#screen {
    position: absolute;
    width: 1920px;
    height: 1080px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--screen-scale, 1));
    transform-origin: center;
    overflow: hidden;
    background: #000;
}

/* Background slideshow */

.background {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    opacity: 0;
    z-index: 0;
    transform: scale(1);
    transition: opacity 2s ease-in-out;
    will-change: opacity, transform;
}

.background.active {
    opacity: 1;
    animation: slowZoomIn 20s linear forwards;
}

@keyframes slowZoomIn {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}

/* Dark overlay */

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
    pointer-events: none;
}

/* Logo */

.logo-container {
    position: absolute;
    left: 90px;
    bottom: 70px;
    z-index: 2;
    pointer-events: none;
}

.logo {
    display: block;
    width: 160px;
    height: auto;
    max-height: 120px;
    object-fit: contain;
}
</style>
</head>

<body>

<div id="screen">

    <img id="background1" class="background active" src="assets/ld1.png">
    <img id="background2" class="background" src="assets/ld2.png">

    <div class="overlay"></div>

    <div class="logo-container">
        <img class="logo" src="assets/logo.gif" alt="Server Logo">
    </div>

</div>

<audio id="music" loop preload="auto" src="assets/music.mp3"></audio>

<script>

const screen = document.getElementById("screen");

function resizeScreen() {
    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    screen.style.setProperty("--screen-scale", scale);
}

window.addEventListener("resize", resizeScreen);
resizeScreen();


/* Background slideshow */

const images = [
    "assets/ld1.png",
    "assets/ld2.png",
    "assets/ld3.png"
];

const background1 = document.getElementById("background1");
const background2 = document.getElementById("background2");

let currentImage = 0;
let showingFirst = true;

// Preload the first two images
background1.src = images[0];
background2.src = images[1];

function changeBackground() {
    if (images.length < 2) return;

    currentImage = (currentImage + 1) % images.length;

    const next = showingFirst ? background2 : background1;
    const previous = showingFirst ? background1 : background2;

    let handled = false;

    function showNext() {
        if (handled) return;
        handled = true;

        next.onload = null;

        // Reset the incoming image's zoom
        next.classList.remove("active");
        next.style.animation = "none";
        next.style.transform = "scale(1)";

        // Force the browser to apply the reset
        void next.offsetWidth;

        // Start the new image and its zoom animation
        next.style.animation = "";
        next.classList.add("active");

        // Fade out the previous image
        previous.classList.remove("active");

        showingFirst = !showingFirst;
    }

    next.onload = showNext;

    next.src = images[currentImage];

    // Handle cached images
    if (next.complete && next.naturalWidth > 0) {
        showNext();
    }
}

// Change image every 20 seconds
setInterval(changeBackground, 20000);


/* Music */

const music = document.getElementById("music");

music.volume = 0.35;

let musicStarted = false;

function startMusic() {
    if (musicStarted) return;

    music.play().then(() => {
        musicStarted = true;
        console.log("Loading screen music started.");
    }).catch(error => {
        console.log("Music autoplay blocked. Waiting for interaction.");
    });
}

window.addEventListener("load", startMusic);

document.addEventListener("pointerdown", startMusic);
document.addEventListener("keydown", startMusic);
document.addEventListener("touchstart", startMusic);

document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !musicStarted) {
        startMusic();
    }
});

</script>

</body>
</html>
