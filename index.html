<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Background slideshow */

.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2s ease-in-out;
    z-index: 0;
}

.background.active {
    opacity: 1;
}

/* Dark overlay */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
    pointer-events: none;
}

/* Logo - anchored to actual viewport */

.logo-container {
    position: fixed !important;
    left: 35px !important;
    bottom: 30px !important;
    top: auto !important;
    right: auto !important;
    transform: none !important;
    width: auto;
    height: auto;
    z-index: 10;
    pointer-events: none;
}

.logo {
    display: block;
    width: 160px;
    height: auto;
    max-height: 120px;
    object-fit: contain;
}

/* Keep the loading screen full screen */

body {
    position: relative;
}
</style>
</head>

<body>

<img id="background1" class="background active" src="assets/ld1.png">
<img id="background2" class="background" src="assets/ld2.png">

<div class="overlay"></div>

<div class="logo-container">
    <img class="logo" src="assets/logo.gif" alt="Logo">
</div>

<audio id="music" loop preload="auto">
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
/* Background slideshow */

const images = [
    "assets/ld1.png",
    "assets/ld2.png",
    "assets/ld3.png"
];

const background1 = document.getElementById("background1");
const background2 = document.getElementById("background2");

let currentImage = 0;
let showingFirst = true;

function changeBackground() {
    currentImage = (currentImage + 1) % images.length;

    const next = showingFirst ? background2 : background1;
    const previous = showingFirst ? background1 : background2;

    next.src = images[currentImage];

    next.onload = () => {
        next.classList.add("active");
        previous.classList.remove("active");
        showingFirst = !showingFirst;
    };
}

setInterval(changeBackground, 20000);


/* Music */

const music = document.getElementById("music");

music.volume = 0.35;

let musicStarted = false;

function startMusic() {
    if (musicStarted) return;

    music.play().then(() => {
        musicStarted = true;
        console.log("Loading screen music started.");
    }).catch(error => {
        console.log("Music autoplay blocked. Waiting for interaction.");
    });
}

// Attempt autoplay
window.addEventListener("load", startMusic);

// Retry when the player interacts
document.addEventListener("pointerdown", startMusic);
document.addEventListener("keydown", startMusic);
document.addEventListener("touchstart", startMusic);

// Retry if the loading screen becomes visible again
document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !musicStarted) {
        startMusic();
    }
});
</script>

</body>
</html>
