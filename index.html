<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Loading Screen</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    z-index: 0;
    transition: opacity 2s ease-in-out;
}

.background.active {
    opacity: 1;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
    pointer-events: none;
}

.logo-container {
    position: fixed;
    left: 9%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
}

.logo {
    width: 160px;
    height: auto;
    object-fit: contain;
}
</style>
</head>

<body>

<img id="background1" class="background active">
<img id="background2" class="background">

<div class="overlay"></div>

<div class="logo-container">
    <img class="logo" src="assets/logo.gif" alt="Server Logo">
</div>

<audio id="music" autoplay loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
const images = [
    "assets/ld1.png",
    "assets/ld2.png",
    "assets/ld3.png"
];

const background1 = document.getElementById("background1");
const background2 = document.getElementById("background2");

let currentImage = 0;
let showingFirst = true;

// Load the first image immediately.
background1.src = images[0];

// Preload the next image.
if (images.length > 1) {
    background2.src = images[1];
}

background1.onerror = () => console.error("Failed to load:", background1.src);
background2.onerror = () => console.error("Failed to load:", background2.src);

function changeBackground() {
    if (images.length < 2) return;

    currentImage = (currentImage + 1) % images.length;

    const nextBackground = showingFirst ? background2 : background1;
    const currentBackground = showingFirst ? background1 : background2;

    nextBackground.src = images[currentImage];

    nextBackground.classList.add("active");
    currentBackground.classList.remove("active");

    showingFirst = !showingFirst;
}

setInterval(changeBackground, 20000);

// Music
const music = document.getElementById("music");
music.volume = 0.35;

music.play().catch(() => {
    console.log("Music autoplay was blocked.");
});
</script>

</body>
</html>
