<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    position: relative;
}

/* Background slideshow */

.background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1);
    transition: opacity 2s ease-in-out;
    will-change: transform, opacity;
}

.background.active {
    opacity: 1;
    animation: slowZoomIn 20s linear forwards;
}

@keyframes slowZoomIn {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}

/* Dark overlay */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 1;
    pointer-events: none;
}

/* Bright blurred transition */

.transition-flash {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background: rgba(255, 255, 255, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: all 1s ease;
}

.transition-flash.active {
    opacity: 1;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* Logo */

.logo-container {
    position: fixed !important;
    left: 35px !important;
    bottom: 30px !important;
    top: auto !important;
    right: auto !important;
    transform: none !important;
    width: auto;
    height: auto;
    z-index: 10;
    pointer-events: none;
}

.logo {
    display: block;
    width: 160px;
    height: auto;
    max-height: 120px;
    object-fit: contain;
}
</style>
</head>

<body>

<img id="background1" class="background active" src="assets/ld1.png">
<img id="background2" class="background" src="assets/ld2.png">

<div class="overlay"></div>
<div class="transition-flash"></div>

<div class="logo-container">
    <img class="logo" src="assets/logo.gif" alt="Logo">
</div>

<audio id="music" loop preload="auto">
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>

/* Background slideshow */

const images = [
    "assets/ld1.png",
    "assets/ld2.png",
    "assets/ld3.png"
];

const background1 = document.getElementById("background1");
const background2 = document.getElementById("background2");
const flash = document.querySelector(".transition-flash");

let currentImage = 0;
let showingFirst = true;

function changeBackground() {
    currentImage = (currentImage + 1) % images.length;

    const next = showingFirst ? background2 : background1;
    const previous = showingFirst ? background1 : background2;

    next.classList.remove("active");
    next.style.animation = "none";
    next.style.transform = "scale(1)";

    const showNext = () => {
        next.onload = null;

        // Reset zoom before starting the new animation
        next.style.animation = "none";
        next.style.transform = "scale(1)";

        // Force browser to apply reset
        void next.offsetWidth;

        next.classList.add("active");
        next.style.animation = "";

        previous.classList.remove("active");

        flash.classList.add("active");

        setTimeout(() => {
            flash.classList.remove("active");
        }, 1000);

        showingFirst = !showingFirst;
    };

    next.onload = showNext;
    next.onerror = () => {
        console.error("Could not load background:", images[currentImage]);
        next.onload = null;
    };

    next.src = images[currentImage];

    if (next.complete && next.naturalWidth > 0) {
        showNext();
    }
}

setInterval(changeBackground, 20000);


/* Music */

const music = document.getElementById("music");

music.volume = 0.35;

let musicStarted = false;

function startMusic() {
    if (musicStarted) return;

    music.play().then(() => {
        musicStarted = true;
        console.log("Loading screen music started.");
    }).catch(error => {
        console.log("Music autoplay blocked. Waiting for interaction.");
    });
}

window.addEventListener("load", startMusic);

document.addEventListener("pointerdown", startMusic);
document.addEventListener("keydown", startMusic);
document.addEventListener("touchstart", startMusic);

document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !musicStarted) {
        startMusic();
    }
});

</script>

</body>
</html>
